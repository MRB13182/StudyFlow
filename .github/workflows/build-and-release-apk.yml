name: StudyFlow Build, Test & APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.1.0)'
        required: false
        default: '1.1.0'
      release_notes:
        description: 'Release notes / Changelog'
        required: false
        default: 'Maintenance updates, performance improvements, and bug fixes.'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Website & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Lint and Regression Test Suite
        run: npm run ci

      - name: Generate Branding Assets
        run: python3 scripts/generate-brand-assets.py

      - name: Build Web Application
        run: npm run build

      - name: Synchronize Capacitor Android Platform
        run: |
          npx cap sync android
          cp -rf BRANDING_ASSETS/app-icon/android/* android/app/src/main/res/

      - name: Build Android Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK Integrity and Generate Checksums
        id: verify_apk
        run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: APK build failed! $APK_SRC not found."
            exit 1
          fi
          
          # Check size (> 1 MB)
          APK_SIZE=$(stat -c%s "$APK_SRC")
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK file size ($APK_SIZE bytes) is under 1MB threshold!"
            exit 1
          fi
          
          # Copy to required target output paths
          cp "$APK_SRC" .build-outputs/app-debug.apk
          cp "$APK_SRC" APK_DOWNLOAD/app-debug.apk
          cp "$APK_SRC" public/app-debug.apk
          
          # Compute SHA-256 Checksum
          APK_SHA=$(sha256sum "$APK_SRC" | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "$APK_SHA  app-debug.apk" > .build-outputs/checksums.txt
          echo "$APK_SHA  app-debug.apk" > APK_DOWNLOAD/checksums.txt
          
          echo "Built APK successfully: size $APK_SIZE bytes, SHA-256 $APK_SHA"

      - name: Update Release Metadata
        run: |
          APK_SHA="${{ steps.verify_apk.outputs.APK_SHA256 }}"
          APK_SIZE="${{ steps.verify_apk.outputs.APK_SIZE }}"
          cat <<EOF > public/release-metadata.json
          {
            "version": "1.1.0",
            "versionCode": 2,
            "releaseNotes": "StudyFlow v1.1.0: Full multi-day block time selection, subject edit modal, fixed bottom navigation, and official Android APK release.",
            "minimumSupportedVersionCode": 1,
            "apkUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/APK_DOWNLOAD/app-debug.apk",
            "sha256": "$APK_SHA",
            "fileSizeBytes": $APK_SIZE,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-android-debug-apk
          path: |
            .build-outputs/app-debug.apk
            .build-outputs/checksums.txt
            public/release-metadata.json
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build-outputs/app-debug.apk
            .build-outputs/checksums.txt
            public/release-metadata.json
          name: "StudyFlow v1.1.0 (Build 2)"
          body: |
            ## StudyFlow v1.1.0 Official Android APK Release
            
            - **Package ID**: `com.studyflow.app`
            - **Version Name**: `1.1.0`
            - **Version Code**: `2`
            - **Target SDK**: Android 14 (API 34)
            - **Minimum SDK**: Android 7.0 (API 24)
            - **SHA-256 Checksum**: `${{ steps.verify_apk.outputs.APK_SHA256 }}`
            - **APK File Size**: `${{ steps.verify_apk.outputs.APK_SIZE }}` bytes
            
            ### Included Changes
            - Multi-day selection in Block Time with grouped editing
            - In-place Subject editing modal
            - Flush bottom glassmorphism navigation
            - Official brand asset system and Android adaptive launcher icons
            - Automatic in-app update checker and self-contained installer handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
