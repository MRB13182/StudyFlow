name: StudyFlow Web and Android Debug APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generator dependency
        run: python -m pip install Pillow
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate single-source branding
        run: npm run branding:generate
      - name: Run checks and build web assets
        run: npm run ci
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set automated version for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1,$2,$3}')
          echo "ANDROID_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Verify and copy APK
        run: |
          bash scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p .build-outputs APK_DOWNLOAD
          cp android/app/build/outputs/apk/debug/app-debug.apk .build-outputs/app-debug.apk
          cp .build-outputs/app-debug.apk APK_DOWNLOAD/app-debug.apk
          cmp .build-outputs/app-debug.apk APK_DOWNLOAD/app-debug.apk
          sha256sum .build-outputs/app-debug.apk APK_DOWNLOAD/app-debug.apk | tee .build-outputs/checksums.txt
          echo "APK_SIZE=$(stat -c%s .build-outputs/app-debug.apk)" >> "$GITHUB_ENV"
          echo "APK_SHA=$(sha256sum .build-outputs/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Package project ZIP including both APK copies
        run: |
          zip -qr StudyFlow-project-with-apk.zip . \
            -x '.git/*' 'node_modules/*' 'android/.gradle/*' 'android/app/build/*' 'dist/*' '*/.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: studyflow-project-and-debug-apk
          path: |
            StudyFlow-project-with-apk.zip
            .build-outputs/app-debug.apk
            APK_DOWNLOAD/app-debug.apk
            .build-outputs/checksums.txt
            README-APK-AUTO-UPDATE.md
          retention-days: 30
      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build-outputs/app-debug.apk
            .build-outputs/checksums.txt
          generate_release_notes: true
      - name: Generate release metadata artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          APK_SHA: ${{ env.APK_SHA }}
          APK_SIZE: ${{ env.APK_SIZE }}
        run: |
          VERSION="${TAG#v}"
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1,$2,$3}')
          mkdir -p release-metadata
          cat > release-metadata/release-metadata.json <<EOF
          {
            "version": "$VERSION",
            "versionCode": $CODE,
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk",
            "sha256": "$APK_SHA",
            "fileSizeBytes": $APK_SIZE,
            "minimumSupportedVersionCode": 1,
            "releaseNotes": "StudyFlow $VERSION",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Publish release metadata to main branch
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          META_B64=$(base64 -w0 release-metadata/release-metadata.json)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/public/release-metadata.json?ref=main" --jq .sha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/public/release-metadata.json" \
            -f message="Publish release metadata for $GITHUB_REF_NAME" \
            -f branch=main -f sha="$SHA" -f content="$META_B64"
      - name: Upload release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-release-metadata
          path: release-metadata/release-metadata.json
          retention-days: 90
